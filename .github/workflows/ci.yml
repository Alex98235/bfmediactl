name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    # Windows-only: the tool targets the Windows Runtime (WinRT) media API.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.17.0'
          $url = "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP 'zig'
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $zigDir = (Get-ChildItem -Path $dir -Recurse -Filter zig.exe | Select-Object -First 1).DirectoryName
          $zigDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
